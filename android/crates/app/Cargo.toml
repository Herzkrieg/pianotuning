[package]
name = "pianotuner"
version = "0.1.0"
edition = "2021"
description = "Android piano tuner app shell (egui UI + cpal audio) around tuner-core"

[lib]
name = "pianotuner"
# cdylib is what cargo-apk loads on Android; rlib keeps the crate usable for
# host builds and unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
tuner-core = { path = "../tuner-core" }
egui = "0.27"
eframe = { version = "0.27", default-features = false, features = ["glow"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.27", default-features = false, features = [
    "glow",
    "android-native-activity",
] }
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }
android_logger = "0.13"
android-activity = { version = "0.5", features = ["native-activity"] }
# Must match the winit version used by eframe/egui-winit 0.27.
winit = { version = "0.29", features = ["android-native-activity"] }
# Default features only: ndk's `audio`/`bitmap` features would raise the
# required API level to 26/30. Oboe loads AAudio dynamically, so API 24 devices
# keep working.
ndk = "0.8"
ndk-context = "0.1"
jni = "0.21"

[package.metadata.android]
package = "com.pianotuner.app"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[package.metadata.android.application]
label = "PianoTuner"
debuggable = true

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize"
